<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Learn With ED — License Admin</title>
<style>body{font-family:Arial,sans-serif;background:#f5f7fb;margin:0;color:#172033}.wrap{max-width:1050px;margin:30px auto;padding:20px}.card{background:#fff;border-radius:14px;padding:20px;margin:15px 0;box-shadow:0 3px 14px #0001}h1{margin-top:0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}input,button,select{padding:12px;border-radius:8px;border:1px solid #ccd3df;font-size:15px}button{cursor:pointer;background:#172033;color:#fff}.primary{background:#0a7d45}.danger{background:#a51d2d}.muted{color:#667085}.stat{font-size:28px;font-weight:700}.ok{color:#087443}.used{color:#a51d2d}table{width:100%;border-collapse:collapse;margin-top:15px}th,td{padding:9px;border-bottom:1px solid #e5e7eb;text-align:left;font-size:13px}code{font-weight:700}#msg{margin:10px 0}.small{font-size:12px}</style></head>
<body><div class="wrap"><div class="card"><h1>🔐 Learn With ED License Admin</h1><p class="muted">JHS Science • GHS 30 per pack • One code / one device</p><div class="grid"><input id="api" placeholder="Worker URL e.g. https://...workers.dev"><input id="key" type="password" placeholder="Admin secret key"><input id="count" type="number" min="1" max="1000" value="10"><input id="prefix" value="EDSCI" placeholder="Code prefix"></div><p><button class="primary" onclick="createCodes()">Generate Access Codes</button> <button onclick="loadCodes()">Refresh / View Codes</button></p><div id="msg"></div></div>
<div class="card"><div class="grid"><div><div class="stat" id="total">0</div><div class="muted">Total codes</div></div><div><div class="stat ok" id="available">0</div><div class="muted">Available</div></div><div><div class="stat used" id="active">0</div><div class="muted">Activated</div></div></div></div>
<div class="card"><h2>Generated / Sold Codes</h2><p class="small muted">Keep this page private. Never publish the admin secret. Reset a code only when you intentionally want to release it for reuse.</p><button onclick="downloadCSV()">Download CSV</button><div id="table"></div></div></div>
<script>
let rows=[];
const $=id=>document.getElementById(id);
function base(){return $('api').value.trim().replace(/\/$/,'')}
function headers(){return {'Content-Type':'application/json','X-Admin-Key':$('key').value}}
function msg(s,ok=false){$('msg').textContent=s;$('msg').style.color=ok?'#087443':'#a51d2d'}
async function call(path,body={}){const r=await fetch(base()+path,{method:'POST',headers:headers(),body:JSON.stringify(body)});return await r.json()}
async function createCodes(){try{if(!base()||!$('key').value)return msg('Enter Worker URL and Admin secret.');const d=await call('/admin/create',{count:Number($('count').value),prefix:$('prefix').value});if(!d.ok)return msg(d.message||'Failed');msg(`✓ Created ${d.count} codes.`,true);await loadCodes();}catch(e){msg('Connection error. Check the Worker URL.')}}
async function loadCodes(){try{if(!base()||!$('key').value)return msg('Enter Worker URL and Admin secret.');const d=await call('/admin/list');if(!d.ok)return msg(d.message||'Failed');rows=d.licenses||[];$('total').textContent=rows.length;$('available').textContent=rows.filter(x=>x.status==='available').length;$('active').textContent=rows.filter(x=>x.status==='active').length;$('table').innerHTML='<table><tr><th>Code</th><th>Status</th><th>Device</th><th>Created</th><th>Activated</th><th>Action</th></tr>'+rows.map(x=>`<tr><td><code>${x.code}</code></td><td>${x.status}</td><td>${x.device_id||'—'}</td><td>${x.created_at||'—'}</td><td>${x.activated_at||'—'}</td><td>${x.status==='active'?`<button class="danger" onclick="resetCode('${x.code}')">Reset</button>`:'—'}</td></tr>`).join('')+'</table>';}catch(e){msg('Connection error. Check the Worker URL.')}}
async function resetCode(code){if(!confirm('Reset '+code+'? This releases it for activation again.'))return;try{const d=await call('/admin/reset',{code});msg(d.message||'');await loadCodes()}catch(e){msg('Reset failed')}}
